name: Release

# The whole release process, in one workflow so that the tag and the version
# pass from job to job as outputs. Four ways in:
# - a push to main runs release-please, which keeps the Release PR up to date
#   and, when the Release PR is merged, creates the tag and a draft release;
# - a manual run on main does the same, or with "candidate" creates a release
#   candidate from the open Release PR;
# - a manual run on a tag vX.Y.Z or vX.Y.Z-rc.N runs the pipeline for that tag
#   again (recovery).
# Every way that produces a tag goes through prepare, then the same pipeline:
# build, docs-archive, verify, publish, site. See RELEASING.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate:
        description: Create a release candidate from the open Release PR (run on main)
        type: boolean
        default: false

permissions: {}

# A release in progress is never cancelled by a later push.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/gtriggiano/statica
  SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml

jobs:
  release-please:
    name: Release PR
    if: github.ref == 'refs/heads/main' && !inputs.candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    outputs:
      created: ${{ steps.release-please.outputs.release_created }}
      tag: ${{ steps.release-please.outputs.tag_name }}
    steps:
      # An App token, not GITHUB_TOKEN: events created with GITHUB_TOKEN start
      # no workflows, and the Release PR needs its CI checks.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  candidate:
    name: Release candidate
    if: github.ref == 'refs/heads/main' && inputs.candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - name: Create the tag and the draft pre-release
        id: candidate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --repo "$REPOSITORY" --state open --base main \
            --label 'autorelease: pending' --json number,title,headRefName,body)
          count=$(jq length <<< "$prs")
          if [ "$count" != 1 ]; then
            echo "::error::Found $count open Release PRs, expected 1: there is nothing to release, or release-please has not run yet."
            exit 1
          fi
          title=$(jq -r '.[0].title' <<< "$prs")
          version=$(sed -nE 's/^chore\(main\): release ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' <<< "$title")
          if [ -z "$version" ]; then
            echo "::error::Cannot read the version from the Release PR title: $title"
            exit 1
          fi
          # The Release PR must be main plus its release commit, computed on
          # the commit this candidate is built from.
          head=$(jq -r '.[0].headRefName' <<< "$prs")
          position=$(gh api "repos/$REPOSITORY/compare/$GITHUB_SHA...$head" --jq '"\(.ahead_by) \(.behind_by)"')
          if [ "$position" != "1 0" ]; then
            echo "::error::The Release PR is not computed on the current main ($GITHUB_SHA): wait for release-please to update it, then run again."
            exit 1
          fi
          last=$(gh api "repos/$REPOSITORY/git/matching-refs/tags/v$version-rc." \
            --jq '[.[].ref | capture("rc\\.(?<n>[0-9]+)$").n | tonumber] | max // 0')
          tag="v$version-rc.$((last + 1))"
          gh api "repos/$REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          {
            echo "> [!WARNING]"
            echo "> This is a release candidate of statica $version, published for testing. Do not use it in production."
            echo
            # The changelog preview of the Release PR: the text between its
            # first and its last horizontal rule.
            jq -r '.[0].body' <<< "$prs" | tr -d '\r' | awk '/^---$/ { n++; next } n == 1'
          } > notes.md
          gh release create "$tag" --repo "$REPOSITORY" --draft --prerelease --verify-tag \
            --title "$tag" --notes-file notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare
    needs: [release-please, candidate]
    # The only place that decides whether there is a tag to publish, and which.
    if: >-
      !cancelled() &&
      (needs.release-please.outputs.created == 'true' ||
       needs.candidate.result == 'success' ||
       (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      minor: ${{ steps.tag.outputs.minor }}
      major: ${{ steps.tag.outputs.major }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        env:
          TAG: ${{ needs.release-please.outputs.tag || needs.candidate.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v(([0-9]+)\.([0-9]+)\.[0-9]+)(-rc\.[0-9]+)?$ ]]; then
            echo "::error::$TAG is not a release tag (vX.Y.Z or vX.Y.Z-rc.N)."
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=${BASH_REMATCH[1]}${BASH_REMATCH[4]}"
            echo "minor=${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            echo "major=${BASH_REMATCH[2]}"
            if [ -n "${BASH_REMATCH[4]}" ]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"

  # From here on every job states its condition on the result of its direct
  # needs: the implicit success() looks at the whole chain of dependencies, and
  # there release-please or candidate is always skipped.
  build:
    name: Build
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # upload the assets to the draft release
      packages: write # push the image
      id-token: write # sign the attestations
      attestations: write
      artifact-metadata: write # listed by actions/attest; storage records are off
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # The provenance names the commit of this run: it must be the tag's. It
      # differs only if a later push replaced the queued run of the merge;
      # then run this workflow on the tag.
      # A published release is never built again: GoReleaser would push the
      # version tag of the image again before failing on the release.
      - name: Check the tag and its draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$REPOSITORY/commits/$TAG" --jq .sha)
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG points to $sha, but this run is for $GITHUB_SHA. Run the Release workflow on the tag $TAG."
            exit 1
          fi
          draft=$(gh release view "$TAG" --repo "$REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != true ]; then
            echo "::error::The release $TAG is published: it cannot be built again. Fix the problem with a new version."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      # No caches in release jobs: a cache written by another run could end up
      # in the artifacts.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Keep both versions equal to GORELEASER_VERSION and SYFT_VERSION in the Makefile.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          install-only: true
      - name: Build and upload with GoReleaser
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ needs.prepare.outputs.tag }}
        run: goreleaser release --clean
      - name: Read the image digest
        id: image
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{ .Manifest.Digest }}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/statica_${{ needs.prepare.outputs.version }}_checksums.txt
      - name: Attest the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives
          path: |
            dist/*.tar.gz
            dist/*_checksums.txt
          if-no-files-found: error
          retention-days: 7
    outputs:
      digest: ${{ steps.image.outputs.digest }}

  docs-archive:
    name: Documentation archive
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # upload the archive to the draft release
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      # The version shown by the version selector and the banner.
      DOCS_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.node-version
          package-manager-cache: false
      - run: make docs-install
      # The site of this version lives under vX.Y/ of the site root, or next/
      # for a release candidate (see "Versioned documentation" in RELEASING.md).
      - name: Select the site base
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          CONFIGURED_ROOT: ${{ vars.DOCS_BASE }}
          MINOR: ${{ needs.prepare.outputs.minor }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          root="${CONFIGURED_ROOT:-/$REPOSITORY_NAME/}"
          if [ "$PRERELEASE" = true ]; then folder=next; else folder="v$MINOR"; fi
          {
            echo "DOCS_SITE_ROOT=$root"
            echo "DOCS_BASE=$root$folder/"
          } >> "$GITHUB_ENV"
      - run: make docs-build
      - run: make docs-check
      - name: Upload the archive to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          archive="statica_${VERSION}_docs.tar.gz"
          tar -C docs/.vitepress/dist -czf "$archive" .
          gh release upload "$TAG" "$archive" --repo "$REPOSITORY" --clobber

  verify:
    name: Verify (${{ matrix.platform }})
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DIGEST: ${{ needs.build.outputs.digest }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Run the image
        run: |
          set -euo pipefail
          image="$IMAGE@$DIGEST"
          out=$(docker run --rm "$image" version)
          echo "$out"
          grep -qF "statica $VERSION (revision $GITHUB_SHA;" <<< "$out"
          docker run --rm --read-only \
            -v "$PWD/docs/examples/container.yaml:/etc/statica/config.yaml:ro" \
            "$image" config validate
      - name: Verify the image attestation
        run: gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$REPOSITORY" --signer-workflow "$SIGNER_WORKFLOW"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives
          path: dist
      - name: Verify and run the archive
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cd dist
          archive="statica_${VERSION}_linux_${ARCH}.tar.gz"
          sha256sum --check --ignore-missing "statica_${VERSION}_checksums.txt"
          gh attestation verify "$archive" --repo "$REPOSITORY" --signer-workflow "$SIGNER_WORKFLOW"
          tar -xzf "$archive" statica
          out=$(./statica version)
          echo "$out"
          grep -qF "statica $VERSION (revision $GITHUB_SHA;" <<< "$out"

  publish:
    name: Publish
    needs: [prepare, build, verify, docs-archive]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.docs-archive.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # publish the release
      packages: write # move the floating image tags
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      MINOR: ${{ needs.prepare.outputs.minor }}
      MAJOR: ${{ needs.prepare.outputs.major }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      DIGEST: ${{ needs.build.outputs.digest }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      # Nothing becomes public before the image: if the package is not public,
      # this job stops until it is made public.
      - name: Check that the image is public
        run: |
          if ! docker buildx imagetools inspect "$IMAGE@$DIGEST" > /dev/null 2>&1; then
            echo "::error::$IMAGE cannot be pulled without credentials. Make the package public (Package settings, Change visibility) and re-run this job."
            exit 1
          fi
      - if: needs.prepare.outputs.prerelease == 'false'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Move the floating tags to the verified digest
        if: needs.prepare.outputs.prerelease == 'false'
        run: |
          set -euo pipefail
          tags=(-t "$IMAGE:$MINOR" -t "$IMAGE:latest")
          if [ "$MAJOR" -ge 1 ]; then tags+=(-t "$IMAGE:$MAJOR"); fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"
      - name: Add the Install section to the notes
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPOSITORY" --json body --jq .body > notes.md
          if grep -q '^## Install$' notes.md; then
            echo "The notes already have an Install section."
            exit 0
          fi
          if [ "$PRERELEASE" = true ]; then docs=next; else docs="v$MINOR"; fi
          cat >> notes.md <<EOF

          ---

          ## Install

          **Container image** for linux/amd64 and linux/arm64:

          \`\`\`sh
          docker pull $IMAGE:$VERSION
          \`\`\`

          Pin it by digest: \`$IMAGE@$DIGEST\`

          **Binaries** for Linux and macOS are attached below. Verify an archive before you use it:

          \`\`\`sh
          sha256sum --check --ignore-missing statica_${VERSION}_checksums.txt       # Linux
          shasum -a 256 --check --ignore-missing statica_${VERSION}_checksums.txt   # macOS
          gh attestation verify statica_${VERSION}_linux_amd64.tar.gz --repo $REPOSITORY \\
            --signer-workflow $SIGNER_WORKFLOW
          \`\`\`

          Documentation: https://gtriggiano.github.io/statica/$docs/guide/installation.html
          EOF
          gh release edit "$TAG" --repo "$REPOSITORY" --notes-file notes.md
      - name: Publish the release
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --repo "$REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --repo "$REPOSITORY" --draft=false --latest
          fi

  site:
    name: Documentation site
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    # The self-repository form ($/...) that zizmor suggests is not yet accepted
    # by actionlint; the SHA-pinning policy does not apply to reusable workflows.
    uses: ./.github/workflows/docs.yml # zizmor: ignore[self-repository]
    with:
      deploy: true
      audit: false
    permissions:
      contents: read
      pages: write
      id-token: write
