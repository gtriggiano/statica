<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -120 240 240" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="statica-orange" x1="-60" y1="-66" x2="60" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="statica-amber" x1="-38" y1="-44" x2="38" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Outer Structural Brackets (Warm Alabaster in Dark Mode) -->
  <g fill="#FAF9F6">
    <!-- Upper Hexagonal Bracket -->
    <polygon points="-90.07,-43 -90.07,-52 0,-104 90.07,-52 90.07,29 69.28,17 69.28,-40 0,-80 -69.28,-40 -69.28,-31"/>
    <!-- Lower Hexagonal Bracket -->
    <polygon points="90.07,43 90.07,52 0,104 -90.07,52 -90.07,-29 -69.28,-17 -69.28,40 0,80 69.28,40 69.28,31"/>
  </g>

  <!-- 3D Isometric Amber Inner Bevels -->
  <g fill="url(#statica-amber)">
    <!-- Upper Hollow Bevel -->
    <polygon points="0,-44 38.11,-22 38.11,-11 0,-33 -21.65,-20.5 -30.31,-26.5"/>
    <!-- Lower Hollow Bevel -->
    <polygon points="0,44 -38.11,22 -38.11,11 0,33 21.65,20.5 30.31,26.5"/>
  </g>

  <!-- Core Isometric 'S' Monolith (International Signal Orange) -->
  <polygon
    fill="url(#statica-orange)"
    points="0,-66 57.16,-33 57.16,10 38.11,-1 38.11,-22 0,-44 -30.31,-26.5 57.16,24 57.16,33 0,66 -57.16,33 -57.16,-10 -38.11,1 -38.11,22 0,44 30.31,26.5 -57.16,-24 -57.16,-33"
  />
</svg>
